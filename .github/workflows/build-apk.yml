name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Install Qt Desktop (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'linux'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt-host'
          set-env: false

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ github.workspace }}/qt-android'

      - name: Build APK (auto-detect paths/target)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          QT_HOST_PATH=$(dirname $(dirname $(find ${{ github.workspace }}/qt-host -name "qmake" | head -n1)))
          echo "Detected QT_HOST_PATH=$QT_HOST_PATH"

          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DQT_ANDROID_ABIS=arm64-v8a \
                   -DANDROID_NDK=$ANDROID_NDK_HOME \
                   -DQT_HOST_PATH=$QT_HOST_PATH \
                   -DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake

          cmake --build . --parallel $(nproc)

      - name: Upload APK (auto-find, no hardcoded path)
        uses: actions/upload-artifact@v4
        with:
          name: waifu-reader-apk
          path: build/**/*.apk
